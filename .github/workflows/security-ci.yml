name: Security and syntax guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile main.py sheets.py pdf_generator.py

      - name: Reject obvious committed secrets
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          patterns = {
              "Telegram bot token": re.compile(r"\b\d{8,12}:[A-Za-z0-9_-]{30,}\b"),
              "private key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "GitHub token": re.compile(r"\bgh[pousr]_[A-Za-z0-9]{20,}\b"),
              "AWS access key": re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
          }

          ignored_parts = {".git", "venv", ".venv", "__pycache__"}
          hits = []
          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file() or ignored_parts.intersection(path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      hits.append(f"{path}: {label}")

          if hits:
              print("Potential committed secrets detected:")
              for hit in hits:
                  print(f"- {hit}")
              sys.exit(1)
          print("No obvious committed secrets found.")
          PY
